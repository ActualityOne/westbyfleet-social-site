name: Supabase keep-alive

# Supabase free-tier projects pause automatically after 7 days with no
# activity. This pings the events table every 3 days so the diary
# database never gets paused. Requires two repo secrets:
#   SUPABASE_URL      e.g. https://xxxxxxxxxxxx.supabase.co
#   SUPABASE_ANON_KEY the project's anon/publishable API key

on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "SUPABASE_URL secret not set yet, skipping."
            exit 0
          fi
          curl --fail --silent --show-error \
            "${{ secrets.SUPABASE_URL }}/rest/v1/events?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
